<!-- ══════════ 하단: 100점이 보장하지 않는 것 ══════════ -->
<rect x="34" y="742" width="1292" height="124" rx="10" fill="#fff8f0" stroke="#b06d00" stroke-width="1.3"/>
<text x="56" y="772" font-size="15" font-weight="700" fill="#7a4b00">100점이 보장하지 않는 것</text>
<text x="56" y="798" font-size="13.5" fill="#3f3f3d">Lighthouse SEO 점수는 <tspan font-weight="700">기술적 체크리스트</tspan>다. 검색봇이 걸려 넘어질 만한 것이 없다는 뜻이지, 검색 순위를 예측하지 않는다.</text>
<text x="56" y="822" font-size="13.5" fill="#3f3f3d">순위를 만드는 것은 콘텐츠의 유용성과 도메인 신뢰도이고, 그건 이 점수 밖에 있다. 구조화 데이터도 리치 결과 <tspan font-weight="700">자격</tspan>을 줄 뿐 노출을 확정하지 않는다.</text>
<text x="56" y="846" font-size="13.5" fill="#3f3f3d">색인 반영 여부는 Search Console 의 실제 색인 상태로만 확인된다 — 이 도표는 그 앞단, "차단 요소가 없다"까지를 증명한다.</text>

